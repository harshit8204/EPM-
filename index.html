<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Employment Management System</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#1a1a1a;color:#fff;min-height:100vh}#root{display:flex;justify-content:center;align-items:center;min-height:100vh}.container{background:#222;padding:30px;border-radius:8px;box-shadow:0 0 20px rgba(0,0,0,0.5);text-align:center;max-width:400px;width:100%}h1{margin-bottom:30px;color:#4CAF50}input{width:100%;padding:12px;margin:10px 0;border:none;border-radius:4px;font-size:16px}button{width:100%;padding:12px;margin-top:20px;background:#4CAF50;color:white;border:none;border-radius:4px;cursor:pointer;font-size:16px;font-weight:bold}button:hover{background:#45a049}#loginForm{display:block}#dashboard{display:none}#dashboard h2{margin:20px 0}#dashboard p{margin:15px 0}.logout-btn{background:#f44336;margin-top:30px}#joke-section{margin-top:30px;padding-top:30px;border-top:1px solid #444}.joke-text{font-size:18px;margin:20px 0;padding:20px;background:#333;border-radius:4px;min-height:60px;display:flex;align-items:center;justify-content:center}</style></head><body><div id="root"><div class="container"><div id="loginForm"><h1>EMS Login</h1><input type="email" id="email" placeholder="Email" value="admin@me.com"><input type="password" id="password" placeholder="Password" value="123"><button onclick="handleLogin()">Login</button></div><div id="dashboard"><h1>Welcome Admin!</h1><h2>Employment Management System</h2><p>Dashboard is now active</p><div id="joke-section"><h3>Random Joke Generator</h3><div class="joke-text" id="jokeDisplay">Click button to get a joke!</div><button onclick="getJoke()">Get Random Joke</button></div><button class="logout-btn" onclick="handleLogout()">Logout</button></div></div></div><script>function handleLogin(){const email=document.getElementById('email').value;const password=document.getElementById('password').value;if(email==='admin@me.com'&&password==='123'){document.getElementById('loginForm').style.display='none';document.getElementById('dashboard').style.display='block';localStorage.setItem('loggedInUser',JSON.stringify({role:'admin'}))}else{alert('Invalid Credentials')} }function handleLogout(){document.getElementById('loginForm').style.display='block';document.getElementById('dashboard').style.display='none';localStorage.removeItem('loggedInUser')}function getJoke(){const jokeDisplay=document.getElementById('jokeDisplay');jokeDisplay.textContent='Loading...';fetch('https://v2.jokeapi.dev/joke/Any?type=single').then(response=>response.json()).then(data=>{jokeDisplay.textContent=data.joke}).catch(error=>{jokeDisplay.textContent='Failed to load joke'})}window.onload=function(){const loggedInUser=localStorage.getItem('loggedInUser');if(loggedInUser){document.getElementById('loginForm').style.display='none';document.getElementById('dashboard').style.display='block'}}</script></body></html>
